CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW=y
# Do NOT set CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER here: ZMK's ext-power is bound
# to P0.13, which is the nice!nano's switched VCC that powers this board's
# display. Toggling RGB would then toggle the display rail. The LED rail is held
# on by the led_power_hog GPIO hog in im_board.overlay instead.

# LED strip driver.
# In Zephyr 3.5 WS2812_STRIP is the parent menuconfig and the SPI backend is a
# choice under it (default SPI). Without WS2812_STRIP the driver sources are not
# compiled at all and the link fails on __device_dts_ord_* for zmk,underglow.
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# COL5 / COL6 are P0.10 / P0.09, the nRF52840 NFC pins. They are freed by the
# &uicr { nfct-pins-as-gpios; } node in im_board.overlay; this Kconfig is the
# Zephyr 3.5 equivalent and is kept as belt and braces (it no longer exists in
# Zephyr 4.x, where the UICR property is the only way).
CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# 68 x SK6812 all-white at full brightness is about 1.4 A. Cap it.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=70
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=70

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y

# Disables the requirement to physically unlock the board every time you connect to Studio
# You can remove this line later if you want strict security, but it makes setup much easier
CONFIG_ZMK_STUDIO_LOCKING=n
